name: Tailor distribution
on:
  workflow_call:
    inputs:
      tailor_meta:
        type: string
        default: master
      deploy:
        type: boolean
        default: false
      force_mirror:
        type: boolean
        default: false
      invalidate_docker_cache:
        type: boolean
        default: false
      invalidate_colcon_cache:
        type: boolean
        default: false
      graph_only:
        type: boolean
        default: false
      update_sources:
        type: boolean
        default: false
    secrets:
      TAILOR_GITHUB_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      ANSIBLE_VAULT_PASS:
        required: false

permissions:
  contents: read

concurrency:
  group: tailor-distribution-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rosdistro
          persist-credentials: false
      - run: pip install PyYAML==6.0.2 Jinja2==3.1.6
      - name: Validate untrusted configuration without credentials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          from jinja2 import StrictUndefined
          from jinja2.sandbox import SandboxedEnvironment
          root = Path('rosdistro')
          for directory in ('rosdistro', 'rosdep', 'config'):
              for path in (root / directory).glob('*.yaml'):
                  if path.name != 'upstream.yaml':
                      yaml.safe_load(path.read_text())
          recipes = yaml.safe_load((root / 'config/recipes.yaml').read_text())
          template = SandboxedEnvironment(undefined=StrictUndefined).from_string(
              (root / 'config/upstream.yaml').read_text())
          for codename in recipes['os']['ubuntu']:
              yaml.safe_load(template.render(distribution=codename))
          PY
  build:
    needs: validate
    # Never run pull-request code on the privileged buildfarm.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') ||
       startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/'))
    runs-on: [self-hosted, linux, x64, tailor]
    environment: ${{ inputs.deploy && 'tailor-production' || 'tailor-build' }}
    timeout-minutes: 1440
    env:
      BUILD_DIR: ${{ github.workspace }}/build-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      GITHUB_TOKEN: ${{ secrets.TAILOR_GITHUB_TOKEN }}
      ANSIBLE_VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASS }}
      TAILOR_GPG_DIR: ${{ vars.TAILOR_GPG_DIR }}
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: rosdistro
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: locusrobotics/tailor-meta
          ref: ${{ inputs.tailor_meta }}
          token: ${{ secrets.TAILOR_GITHUB_TOKEN }}
          path: tailor-meta
          persist-credentials: false
      - run: |
          test -n "$TAILOR_GPG_DIR"
          test -d "$TAILOR_GPG_DIR"
          test -n "$GITHUB_TOKEN"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          python3 -m venv "$RUNNER_TEMP/tailor-venv"
          "$RUNNER_TEMP/tailor-venv/bin/pip" install -e ./tailor-meta
          mkdir "$BUILD_DIR"
          cp -a rosdistro tailor-meta "$BUILD_DIR/"
      - name: Build distribution and images
        env:
          DEPLOY: ${{ inputs.deploy }}
          FORCE_MIRROR: ${{ inputs.force_mirror }}
          NO_CACHE: ${{ inputs.invalidate_docker_cache }}
          REBUILD: ${{ inputs.invalidate_colcon_cache }}
          GRAPH_ONLY: ${{ inputs.graph_only }}
          PYTHONPATH: tailor-meta
        run: |
          cd "$BUILD_DIR"
          args=()
          [[ "$DEPLOY" != true ]] || args+=(--deploy)
          [[ "$FORCE_MIRROR" != true ]] || args+=(--force-mirror)
          [[ "$NO_CACHE" != true ]] || args+=(--no-cache)
          [[ "$REBUILD" != true ]] || args+=(--rebuild)
          [[ "$GRAPH_ONLY" != true ]] || args+=(--graph-only)
          "$RUNNER_TEMP/tailor-venv/bin/python" -m tailor_meta.actions build "${args[@]}"
      - name: Manage source workflow stubs
        if: inputs.update_sources && inputs.deploy && !inputs.graph_only
        env:
          PYTHONPATH: tailor-meta
          META_REF: ${{ inputs.tailor_meta }}
        run: |
          cd "$BUILD_DIR"
          plan=$("$RUNNER_TEMP/tailor-venv/bin/python" -m tailor_meta.actions plan)
          track=$(jq -r .track <<< "$plan")
          label=$(jq -r .label <<< "$plan")
          if [[ "$label" == hotdog || "$label" == *-rc ]]; then
            "$RUNNER_TEMP/tailor-venv/bin/create_pipelines" \
              --rosdistro-index rosdistro/rosdistro/index.yaml \
              --recipes rosdistro/config/recipes.yaml --github-key "$GITHUB_TOKEN" \
              --meta-branch "$META_REF" --release-track "$track" \
              --release-label "$label" --rosdistro-job "$GITHUB_REPOSITORY" --deploy
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-diagnostics
          retention-days: 30
          path: |
            ${{ env.BUILD_DIR }}/workspace/recipes/*.yaml
            ${{ env.BUILD_DIR }}/workspace/graphs/*
            ${{ env.BUILD_DIR }}/workspace/dependencies/*
            ${{ env.BUILD_DIR }}/workspace/src/**/*_repositories_data.jsonl
            ${{ env.BUILD_DIR }}/build-report-*.yaml
            ${{ env.BUILD_DIR }}/builds/*/build-report-*.yaml
      - uses: actions/upload-artifact@v4
        if: success() && !inputs.deploy && !inputs.graph_only
        with:
          name: tailor-packages
          retention-days: 7
          path: ${{ env.BUILD_DIR }}/packages/**/*.deb
      - name: Remove run-local build outputs
        if: always()
        run: |
          # Delete only this run's generated directory, never shared runner data.
          case "$BUILD_DIR" in
            "$GITHUB_WORKSPACE/build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
              sudo rm -rf -- "$BUILD_DIR" ;;
            *) exit 1 ;;
          esac
