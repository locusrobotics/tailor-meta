name: Tailor distribution
on:
  workflow_call:
    inputs:
      tailor_meta:
        type: string
        required: true
      mode:
        description: validate, graph, packages, or release
        type: string
        default: packages
      force_mirror:
        type: boolean
        default: false
      invalidate_docker_cache:
        type: boolean
        default: false
      invalidate_colcon_cache:
        type: boolean
        default: false
    secrets:
      TAILOR_SOURCE_TOKEN:
        description: Read-only source access
        required: false
      AWS_READ_ACCESS_KEY_ID:
        required: false
      AWS_READ_SECRET_ACCESS_KEY:
        required: false
      AWS_READ_SESSION_TOKEN:
        required: false
      AWS_ACCESS_KEY_ID:
        description: Publication credentials, used only in mirror/publish/images stages
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      AWS_SESSION_TOKEN:
        required: false
      ANSIBLE_VAULT_PASS:
        required: false
permissions:
  contents: read
concurrency:
  group: tailor-distribution-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rosdistro
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: locusrobotics/tailor-meta
          ref: ${{ inputs.tailor_meta }}
          path: tailor-meta
          persist-credentials: false
      - run: pip install PyYAML==6.0.2 Jinja2==3.1.6
      - name: Validate configuration and mode
        env:
          MODE: ${{ inputs.mode }}
        run: python3 tailor-meta/ci/validate.py rosdistro --mode "$MODE"
  build:
    needs: validate
    if: >-
      inputs.mode != 'validate' && github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/') ||
       startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/'))
    runs-on: [self-hosted, linux, x64, tailor]
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: ${{ github.workspace }}/build-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_DEFAULT_REGION: us-east-1
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: rosdistro
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: locusrobotics/tailor-meta
          ref: ${{ inputs.tailor_meta }}
          path: tailor-meta
          persist-credentials: false
      - name: Create immutable build identity
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python3 -m venv "$RUNNER_TEMP/tailor-venv"
          "$RUNNER_TEMP/tailor-venv/bin/pip" install -e ./tailor-meta
          echo "$RUNNER_TEMP/tailor-venv/bin" >> "$GITHUB_PATH"
          mkdir "$BUILD_DIR"
          cp -a rosdistro tailor-meta "$BUILD_DIR/"
          cd "$BUILD_DIR"
          tailor_actions plan --mode "$MODE"
      - name: Fetch and record source revisions
        env:
          GITHUB_TOKEN: ${{ secrets.TAILOR_SOURCE_TOKEN }}
          NO_CACHE: ${{ inputs.invalidate_docker_cache }}
        run: |
          cd "$BUILD_DIR"
          args=()
          [[ "$NO_CACHE" != true ]] || args+=(--no-cache)
          tailor_actions fetch "${args[@]}"
      - name: Publish dependency mirrors
        if: inputs.mode == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TAILOR_GPG_DIR: ${{ vars.TAILOR_GPG_DIR }}
          FORCE_MIRROR: ${{ inputs.force_mirror }}
        run: |
          cd "$BUILD_DIR"
          args=()
          [[ "$FORCE_MIRROR" != true ]] || args+=(--force-mirror)
          tailor_actions mirror "${args[@]}"
      - name: Resolve package graphs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_READ_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_READ_SESSION_TOKEN }}
        run: |
          cd "$BUILD_DIR"
          tailor_actions graph
      - name: Build all OS package sets
        if: inputs.mode != 'graph'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_READ_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_READ_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_READ_SESSION_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TAILOR_SOURCE_TOKEN }}
          REBUILD: ${{ inputs.invalidate_colcon_cache }}
          NO_CACHE: ${{ inputs.invalidate_docker_cache }}
        run: |
          cd "$BUILD_DIR"
          args=()
          [[ "$REBUILD" != true ]] || args+=(--rebuild)
          [[ "$NO_CACHE" != true ]] || args+=(--no-cache)
          tailor_actions packages "${args[@]}"
      - name: Publish verified package sets
        if: inputs.mode == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          TAILOR_GPG_DIR: ${{ vars.TAILOR_GPG_DIR }}
        run: |
          cd "$BUILD_DIR"
          tailor_actions publish
      - name: Build and publish images
        if: inputs.mode == 'release'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          ANSIBLE_VAULT_PASS: ${{ secrets.ANSIBLE_VAULT_PASS }}
          NO_CACHE: ${{ inputs.invalidate_docker_cache }}
        run: |
          cd "$BUILD_DIR"
          args=()
          [[ "$NO_CACHE" != true ]] || args+=(--no-cache)
          tailor_actions images "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tailor-diagnostics
          retention-days: 30
          path: |
            ${{ env.BUILD_DIR }}/build-plan.json
            ${{ env.BUILD_DIR }}/workspace/recipes/*.yaml
            ${{ env.BUILD_DIR }}/workspace/graphs/*
            ${{ env.BUILD_DIR }}/workspace/dependencies/*
            ${{ env.BUILD_DIR }}/builds/*/build-report-*.yaml
      - uses: actions/upload-artifact@v4
        if: success() && inputs.mode == 'packages'
        with:
          name: tailor-packages
          retention-days: 7
          path: ${{ env.BUILD_DIR }}/packages/**/*.deb
      - name: Remove run-local outputs
        if: always()
        run: |
          if [[ -f "$BUILD_DIR/build-plan.json" ]]; then
            (cd "$BUILD_DIR" && tailor_actions cleanup)
          fi
          case "$BUILD_DIR" in
            "$GITHUB_WORKSPACE/build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT") sudo rm -rf -- "$BUILD_DIR" ;;
            *) exit 1 ;;
          esac
