name: Publish toolchain images
on:
  push:
  workflow_dispatch:
  workflow_call:
    inputs:
      tailor_meta:
        type: string
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: tailor-toolchains-${{ github.repository }}-${{ inputs.tailor_meta || github.sha }}
  cancel-in-progress: false
jobs:
  configure:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: configuration
          persist-credentials: false
      - name: Select targets from the caller, never from tailor-meta
        id: matrix
        env:
          IMPLEMENTATION_SHA: ${{ inputs.tailor_meta || github.sha }}
        run: |
          pip install PyYAML==6.0.2
          python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          import yaml
          repo = os.environ['GITHUB_REPOSITORY'].lower()
          sha = os.environ['IMPLEMENTATION_SHA']
          recipes = Path('configuration/config/recipes.yaml')
          if recipes.exists():
              versions = yaml.safe_load(recipes.read_text())['os']['ubuntu']
              entries = [dict(target='builder', os=version, cache=version,
                              image=f'ghcr.io/{repo}:builder-{sha}-{version}') for version in versions]
          elif repo == 'locusrobotics/tailor-meta':
              # Generic management/provisioning tools use the host's native OS.
              native = platform.freedesktop_os_release()['VERSION_CODENAME']
              entries = [dict(target=target, os=native, cache=target,
                              image=f'ghcr.io/{repo}:{target}-{sha}') for target in ('tools', 'imager')]
          else:
              raise SystemExit('Caller must provide config/recipes.yaml')
          if not entries:
              raise SystemExit('No toolchain targets selected')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('matrix=' + json.dumps({'include': entries}), file=output)
          PY
  publish:
    needs: configure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.configure.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: locusrobotics/tailor-meta
          ref: ${{ inputs.tailor_meta || github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve existing SHA tags
        id: existing
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.found != 'true'
        with:
          context: .
          file: environment/toolchains/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ matrix.image }}
          build-args: |
            OS_VERSION=${{ matrix.os }}
            IMPLEMENTATION_SHA=${{ inputs.tailor_meta || github.sha }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ github.repository }}-${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ github.repository }}-${{ matrix.cache }}
      - name: Record published digest
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          printf '%s@%s\n' "${IMAGE%:*}" "$digest" > toolchain.txt
      - uses: actions/upload-artifact@v4
        with:
          name: toolchain-${{ matrix.cache }}
          path: toolchain.txt
