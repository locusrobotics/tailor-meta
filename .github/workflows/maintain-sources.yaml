name: Maintain source workflow stubs
on:
  workflow_call:
    inputs:
      tailor_meta:
        type: string
        required: true
      apply:
        type: boolean
        default: false
      allow_feature:
        description: Explicit manual pilot only; permits a feature-label source hook
        type: boolean
        default: false
    secrets:
      TAILOR_MAINTENANCE_TOKEN:
        required: false
permissions:
  contents: read
concurrency:
  group: tailor-source-maintenance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: rosdistro
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: locusrobotics/tailor-meta
          ref: ${{ inputs.tailor_meta }}
          path: tailor-meta
          persist-credentials: false
      - uses: ./tailor-meta/.github/actions/setup
      - name: Generate or apply aggregated stubs
        env:
          GITHUB_TOKEN: ${{ secrets.TAILOR_MAINTENANCE_TOKEN }}
          APPLY: ${{ inputs.apply }}
          ALLOW_FEATURE: ${{ inputs.allow_feature }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import yaml
          from tailor_meta.actions import release, revision
          from tailor_meta.create_pipelines import create_pipelines
          target = release(os.environ['GITHUB_REF'])
          feature_pilot = (target['kind'] == 'feature' and os.environ['ALLOW_FEATURE'] == 'true'
                           and os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch')
          if target['kind'] not in ('hotdog', 'candidate') and not feature_pilot:
              raise SystemExit('Source maintenance requires master or release/*')
          if os.environ['APPLY'] == 'true' and not os.environ.get('GITHUB_TOKEN'):
              raise SystemExit('TAILOR_MAINTENANCE_TOKEN must be configured before applying source stubs')
          create_pipelines(Path('rosdistro/rosdistro/index.yaml'),
                           yaml.safe_load(Path('rosdistro/config/recipes.yaml').read_text()),
                           os.environ.get('GITHUB_TOKEN'), os.environ['APPLY'] == 'true',
                           revision(Path('tailor-meta')), target['track'], target['label'], Path('stubs'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-workflow-stubs
          path: stubs/**/*.yaml
