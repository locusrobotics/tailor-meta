name: Tailor Python checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y python3-apt python3-venv
          /usr/bin/python3 -m venv --system-site-packages "$RUNNER_TEMP/check-venv"
          "$RUNNER_TEMP/check-venv/bin/pip" install -e . pytest==8.4.1
      - run: |
          "$RUNNER_TEMP/check-venv/bin/python" -m compileall -q tailor_meta tailor_distro tailor_image
      - run: |
          if [[ -d tests ]]; then
            "$RUNNER_TEMP/check-venv/bin/pytest" -o addopts= tests
          fi
      - name: Validate workflow syntax
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= .github/workflows/*.yaml
