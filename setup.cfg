[metadata]
name = tailor-meta
version = attr: tailor_meta.__version__
url = http://tailor.locusbots.io
project_urls =
    GitHub = https://github.com/locusrobotics/tailor-meta
author = Paul Bovbel
author_email = pbovbel@locusrobotics.com
maintainer = Paul Bovbel
maintainer_email = pbovbel@locusrobotics.com
license = Proprietary
description = Build, publish, image, and test ROS distributions with GitHub Actions.
long_description = file: README.md

[options]
python_requires = >=3.10
install_requires =
    Click ==8.2.1
    Jinja2 ==3.1.6
    PyGithub ==2.8.1
    PyYaml ==6.0.2
    rosdistro ==1.0.1
    bloom ==0.13.0
    catkin_pkg ==1.0.0
    gitpython ==3.1.45
    rosdep ==0.26.0
    boto3 ==1.37.37
    awscli ==1.38.37
    colcon-core ==0.20.1
packages =find:
include_package_data = True
setup_requires =
    pytest-runner ==6.0.1
tests_require =
    pytest ==8.4.1
    pytest-mypy ==1.0.1
    pytest-flake8 ==1.3.0

[options.entry_points]
console_scripts =
    create_pipelines = tailor_meta.create_pipelines:main
    update_repo_settings = tailor_meta.update_repo_settings:main
    tailor_actions = tailor_meta.actions:main
    create_recipes = tailor_distro.create_recipes:main
    pull_distro_repositories = tailor_distro.pull_distro_repositories:main
    mirror_upstream = tailor_distro.mirror_upstream:main
    publish_packages = tailor_distro.publish_packages:main
    tailor_manage = tailor_distro.manage:main
    s3_directory_cleanup = tailor_distro.s3_cleanup:main
    s3_versions_cleanup = tailor_distro.s3_versions_cleanup:main
    generate_graphs = tailor_distro.generate_graphs:main
    get_dependency_list = tailor_distro.get_dependency_list:main
    build_packages = tailor_distro.build_packages:main
    build_bundles = tailor_distro.build_bundles:main
    build_report_tree = tailor_distro.build_report_tree:main
    create_image = tailor_image.create_image:main
    cleanup_images = tailor_image.cleanup_images:main
    ec2_list_terminate_packer = tailor_image.ec2_list_terminate_packer:main

colcon_core.verb =
    package-debian = debian_packager.debian_packager:DebianPackagerVerb

[options.package_data]
tailor_distro =
    debian_templates/*
    debian_templates/compat_catkin_tools/*

[aliases]
test=pytest

[tool:pytest]
addopts = --verbose --junitxml=test-results.xml --mypy --flake8
pep8maxlinelength = 120

[flake8]
max-line-length = 120
